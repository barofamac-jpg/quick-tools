<body>
  <script src="/gnb.js"></script>
  <section class="tools_header">
    <h1>🧮 초등 연산 문제 만들기</h1>
    <p>학년·학기를 고르면 교과과정에 맞는 계산 문제지를 만들어 드려요!</p>
  </section>

  <!-- 상단 광고 영역 -->
  <div class="ad-slot ad-slot-top">
    <span class="ad-label">Advertisement</span>
  </div>

  <section class="tools_main">
    <section class="input-section no-print">
      <h2>✏️ 문제지 설정</h2>

      <div class="control-grid">
        <div class="form-group form-group--wide">
          <label for="grade-select">학년 · 학기</label>
          <select id="grade-select">
            <option value="2-1">2학년 1학기 · 두 자리 수의 덧셈과 뺄셈, 세 수의 계산</option>
            <option value="2-2" selected>2학년 2학기 · 곱셈구구</option>
            <option value="3-1">3학년 1학기 · 세 자리 수의 덧셈과 뺄셈, 나눗셈, (두 자리)×(한 자리)</option>
            <option value="3-2">3학년 2학기 · (세 자리)×(한 자리), (두 자리)×(두 자리), (두 자리)÷(한 자리)</option>
            <option value="4-1">4학년 1학기 · (세 자리)×(두 자리), (세 자리)÷(두 자리)</option>
            <option value="4-2">4학년 2학기 · 분모가 같은 분수의 덧셈과 뺄셈, 소수의 덧셈과 뺄셈</option>
            <option value="5-1">5학년 1학기 · 자연수의 혼합 계산, 분모가 다른 분수의 덧셈과 뺄셈</option>
            <option value="5-2">5학년 2학기 · 분수의 곱셈, 소수의 곱셈</option>
            <option value="6-1">6학년 1학기 · (분수)÷(자연수), (소수)÷(자연수)</option>
            <option value="6-2">6학년 2학기 · 분수의 나눗셈, 소수의 나눗셈 (전 과정 정리)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mode-select">테스트 유형</label>
          <select id="mode-select">
            <option value="cumulative" selected>누적 (이전 학기까지 함께)</option>
            <option value="current">현재 학기만</option>
          </select>
        </div>

        <div class="form-group">
          <label for="count-select">문제 수</label>
          <select id="count-select">
            <option value="20">20문제 · 부담 없이</option>
            <option value="30" selected>30문제 · 집중 연습</option>
          </select>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-main" id="btn-generate">🎲 새 문제 만들기</button>
        <button class="btn-sub btn-check" id="btn-check">✅ 바로 채점</button>
        <button class="btn-sub btn-answer" id="btn-answer">👁️ 정답표 보기</button>
        <button class="btn-sub btn-print" id="btn-print">🖨️ 인쇄하기</button>
        <button class="btn-sub btn-pdf" id="btn-pdf">📄 PDF 저장</button>
      </div>
      <p class="btn-hint">인쇄 창이 열리면 프린터를 고르거나 <strong>대상을 “PDF로 저장”</strong>으로 선택하면 파일로 받을 수 있어요. (정답표는 다음 장에 함께 인쇄됩니다.)</p>
    </section>

    <div class="preview-container" id="pdf-area"></div>
  </section>

  <section class="tools_footer">
    초등학생을 위한 연산 문제지 생성기 · 학년·학기 교과과정에 맞춘 계산을 한 장에 담아 연습해요
  </section>
